name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Run tests
        run: pytest -v tests

  pentacene-example:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install example dependencies
        run: pip install -e ".[examples]"

      - name: Run pentacene reference calculation
        run: >-
          python docs/source/tutorials/dyson_from_2pz_vector/pentacene_calculation.py
          --output-dir artifacts/pentacene

      - name: Execute the shared notebook
        run: >-
          jupyter nbconvert --execute --to notebook
          --ExecutePreprocessor.timeout=180
          docs/source/tutorials/dyson_from_2pz_vector/pentacene_example.ipynb
          --output pentacene_example.executed.ipynb
          --output-dir artifacts/pentacene

      - name: Upload calculation and notebook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pentacene-reference-${{ github.sha }}
          path: artifacts/pentacene/
          if-no-files-found: error
          retention-days: 30
